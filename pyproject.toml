[project]
name = "relatorio-atendimentos"
version = "1.0.0"
description = "Relatório Diário de Atendimentos SGG — MultiLife Saúde e Segurança do Trabalho"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Tecnologia MultiLife", email = "tecnologia@multilife.com.br" }]
dependencies = [
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "bcrypt>=4.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "premailer>=3.10",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "structlog>=24.1",
    "tenacity>=8.5",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "time-machine>=2.15",
]

[project.scripts]
relatorio = "relatorio.interfaces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relatorio"]

# ---------------------------------------------------------------- qualidade
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ", "SIM", "RUF", "PL", "N"]
ignore = [
    "PLR0913",  # casos de uso recebem várias dependências por injeção
    "PLR0917",  # idem (argumentos posicionais nos construtores)
    "N818",     # exceções seguem o padrão em português (ErroIntegracao, RelatorioIndisponivel)
    "PLR2004",  # números mágicos são comuns em testes e regras de negócio documentadas
    "RUF001",   # textos em português com caracteres tipográficos (–, ·)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0915", "DTZ001"]
"migrations/**" = ["N999", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["relatorio"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["premailer.*", "apscheduler.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- testes
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: testes que exigem PostgreSQL (TEST_DATABASE_URL)",
]
filterwarnings = [
    "error::DeprecationWarning:relatorio.*",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.coverage.run]
source = ["relatorio"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
