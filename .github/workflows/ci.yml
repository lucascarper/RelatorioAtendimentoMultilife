name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relatorio
          POSTGRES_PASSWORD: relatorio
          POSTGRES_DB: relatorio_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relatorio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TZ: America/Sao_Paulo
      TEST_DATABASE_URL: postgresql://relatorio:relatorio@localhost:5432/relatorio_teste
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          enable-cache: true
      - name: Dependências
        run: uv sync --frozen
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (formatação)
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Pytest (unitários + integração com PostgreSQL)
        run: uv run pytest --cov=relatorio --cov-report=term --cov-report=xml
      - name: Cobertura do módulo de métricas ≥ 80% (RNF09)
        run: uv run coverage report --include="src/relatorio/domain/*" --fail-under=80
      - name: Migrações em dia com os modelos
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: uv run alembic upgrade head && uv run alembic check

  auditoria:
    name: Dependências (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - run: uv export --frozen --no-dev --no-hashes --no-emit-project --format requirements-txt > requirements.txt
      - run: uvx pip-audit --requirement requirements.txt --strict

  imagem:
    name: Imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: relatorio-atendimentos:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: A imagem inicia e responde /health/live
        run: |
          docker run -d --name web -p 8000:8000 -e APP_ENV=development relatorio-atendimentos:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8000/health/live && exit 0; sleep 1; done
          docker logs web; exit 1
