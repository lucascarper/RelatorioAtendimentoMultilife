{% extends "admin/base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<section class="login">
  <img src="/static/brand/logo-multilife-admin.png" alt="MultiLife, Saúde e Segurança do Trabalho" class="login-logo">
  <h1>Entrar no Sistema de Relatórios</h1>
  <p class="sub">Use o usuário e a senha que você recebeu.</p>
  {% if erro %}<div class="mensagem mensagem-erro" role="alert">{{ erro }}</div>{% endif %}
  <form method="post" action="/login" class="form">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Usuário
      <input name="usuario" autocomplete="username" required autofocus>
    </label>
    <label>Senha
      <input name="senha" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn btn-primario btn-bloco">Entrar</button>
  </form>
</section>
{% endblock %}
